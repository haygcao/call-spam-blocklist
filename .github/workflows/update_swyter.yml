name: Auto Update Blocklist Subscriptions

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  sync-and-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖 (phonenumbers)
        run: pip install phonenumbers

      # 步骤 1：下载原始二进制数据库存入 raw_sources/
      - name: 4. 执行第一步：下载原始二进制数据库 (raw_sources/)
        run: python scripts/download_raw.py

      # 步骤 2A：解包源 A 存入 source_a/
      - name: 5. 执行第二步 A：解包源 A 存入 source_a/
        run: python scripts/extract_source_a.py

      # 步骤 2B：抓取源 B 存入 source_b/
      - name: 6. 执行第二步 B：抓取源 B 存入 source_b/
        run: python scripts/fetch_source_b.py

      # 步骤 3：多源合并去重存入 merge/
      - name: 7. 执行第三步：多源合并去重导出存入 merge/
        run: python scripts/merge_and_deduplicate.py

      # 步骤 4：自动提交所有生成的规整规则
      - name: 8. 自动提交并推送变动 (GitHub Actions Bot)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto update blocklist rules and raw sources [skip ci]"
          file_pattern: "raw_sources/ source_a/ source_b/ merge/"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          push_options: '--force'
